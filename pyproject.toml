[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "cyclopes-detector"
version = "0.2.0"
description = "Training and evaluation tools for the Cyclopes browser-local AI image detector"
requires-python = ">=3.11,<3.14"
license = "MIT"

[project.scripts]
cyclopes = "cyclopes.cli:main"

[tool.setuptools]
packages = ["cyclopes"]
