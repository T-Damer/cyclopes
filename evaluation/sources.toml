minimum_images = 50000
maximum_images = 100000
required_scenarios = [
  "photo", "ui", "illustration", "film", "3d", "meme", "logo-text",
  "ai-legacy", "ai-modern", "ai-anime-cgi"
]

# Roots are intentionally outside git. Each source must be absent from training.
# Limits total 80,000. The builder requires every quota and a concrete,
# commercial-compatible license before it will emit a manifest.

[[source]]
name = "eval-real-photo"
root = "../data/evaluation/raw/real-photo"
label = 0
scenario = "photo"
license = "source-specific"
limit = 10000

