name: Build and package extension

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-extension:
    name: Build and create extension ZIP
    runs-on: ubuntu-latest
    outputs:
      zip_path: ${{ steps.package.outputs.zip_path }}
      version: ${{ steps.package.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npm run build

      - name: Create release zip
        id: package
        run: |
          VERSION="$(node -p 'require(\'./package.json\').version')"
          mkdir -p release
          ZIP_PATH="release/cyclopes-${VERSION}.zip"
          (cd dist && zip -r ../${ZIP_PATH} .)
          echo "zip_path=${ZIP_PATH}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          shasum -a 256 "$ZIP_PATH" > "$ZIP_PATH.sha256"

      - name: Verify zip integrity
        run: |
          unzip -t "${{ steps.package.outputs.zip_path }}"

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: cyclopes-extension-${{ steps.package.outputs.version }}
          path: ${{ steps.package.outputs.zip_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Push package to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package.outputs.zip_path }}
          generate_release_notes: true

  publish-stores:
    name: Publish to browser stores (requires secrets)
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push'
    needs: build-extension
    runs-on: ubuntu-latest
    steps:
      - name: Placeholder publish hooks
        run: |
          echo "Store publish workflow is prepared scaffold-wise. Add store actions and set secrets to enable auto publish."
          echo "Expected secrets: CHROME_CLIENT_ID, CHROME_CLIENT_SECRET, CHROME_REFRESH_TOKEN, CHROME_EXTENSION_ID,"
          echo "EDGE_CLIENT_ID, EDGE_CLIENT_SECRET, EDGE_REFRESH_TOKEN, EDGE_EXTENSION_ID,"
          echo "FIREFOX_API_TOKEN, FIREFOX_EXTENSION_ID."
